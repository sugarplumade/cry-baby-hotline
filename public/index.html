<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cry Baby Hotline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" type="image/png" href="/crybabyredlogo.png" />
    <link rel="apple-touch-icon" href="/crybabyredlogo.png" />
  </head>
  <body class="scene-page">
    <main class="photo-only-shell" aria-label="Cry Baby Hotline booth image">
      <div class="photo-only-stage">
        <div class="photo-only-frame">
          <img
            class="photo-only-image"
            src="/phone-booth-night-confess.png"
            alt="Night phone booth"
          />
          <section class="photo-caption" aria-live="polite">
            <p class="photo-caption-location" id="photo-location">Loading latest call...</p>
            <p class="photo-caption-line" id="photo-caption">
              Preparing the latest voice message.
            </p>
            <p class="photo-caption-meta" id="photo-meta">Attempting playback...</p>
          </section>
          <audio id="photo-player" preload="auto" autoplay playsinline></audio>
        </div>
      </div>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
